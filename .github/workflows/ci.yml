name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r qrp_platform/dashboard/requirements.txt
          pip install pytest
      - name: Run smoke tests
        run: pytest -q tests

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --target production -t qrp:ci .
      - name: Smoke (boot container)
        run: |
          docker run --rm -d --name qrp-test -p 8000:8000 qrp:ci
          sleep 4
          curl -fsS http://localhost:8000/health | tee /tmp/health.json
          test "$(jq -r .status /tmp/health.json)" = "ok"
          docker stop qrp-test